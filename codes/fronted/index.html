<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园智能失物招领系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <div class="logo-icon">🎯</div>
                <span>校园失物招领</span>
            </div>
            <nav class="nav">
                <a href="#" class="active" data-page="home">首页</a>
                <a href="#" data-page="lost">寻物登记</a>
                <a href="#" data-page="found">招领登记</a>
                <a href="#" data-page="match">智能匹配</a>
                <a href="#" data-page="profile">个人中心</a>
            </nav>
            <div class="user-info">
                <span class="user-name">未登录</span>
                <div class="user-avatar">U</div>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div id="homePage" class="page">
                <div class="hero">
                    <h1>🔍 校园智能失物招领平台</h1>
                    <p>基于AI技术，智能匹配失物与招领信息，让失物找回更简单</p>
                    <div class="hero-buttons">
                        <button class="btn btn-primary" onclick="app.navigateTo('lost')">📝 登记失物</button>
                        <button class="btn btn-secondary" onclick="app.navigateTo('found')">📋 登记招领</button>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon blue">📦</div>
                        <div class="stat-value">0</div>
                        <div class="stat-label">失物登记</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon green">🎁</div>
                        <div class="stat-value">0</div>
                        <div class="stat-label">招领登记</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon purple">🤝</div>
                        <div class="stat-value">0</div>
                        <div class="stat-label">成功匹配</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon orange">⏳</div>
                        <div class="stat-value">0</div>
                        <div class="stat-label">待匹配</div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">📋 最新动态</h3>
                    </div>
                    <div id="recentItemsGrid" class="items-grid">
                        <div class="loading">
                            <div class="spinner"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="lostPage" class="page" style="display: none;">
                <div class="form-section">
                    <h2 class="form-title">📝 失物登记</h2>
                    <form id="lostItemForm">
                        <div class="form-group">
                            <label class="form-label">物品名称 <span class="required">*</span></label>
                            <input type="text" name="name" class="form-input" placeholder="请输入物品名称" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">物品类别 <span class="required">*</span></label>
                            <select name="category" class="form-input" required>
                                <option value="">请选择类别</option>
                                <option value="电子设备">📱 电子设备</option>
                                <option value="证件卡片">🪪 证件卡片</option>
                                <option value="箱包">🎒 箱包</option>
                                <option value="书籍文具">📚 书籍文具</option>
                                <option value="服饰">👕 服饰</option>
                                <option value="钥匙">🔑 钥匙</option>
                                <option value="其他">📦 其他</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">物品描述 <span class="required">*</span></label>
                            <textarea name="description" class="form-input" placeholder="请详细描述物品特征（颜色、品牌、特殊标记等）" required></textarea>
                            <div class="form-hint">描述越详细，匹配准确率越高</div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">丢失时间 <span class="required">*</span></label>
                                <input type="datetime-local" name="lostTime" class="form-input" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">丢失地点 <span class="required">*</span></label>
                                <input type="text" name="lostLocation" class="form-input" placeholder="如：图书馆二楼" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">物品照片</label>
                            <div class="image-upload" onclick="document.getElementById('lostImages').click()">
                                <div class="image-upload-icon">📷</div>
                                <div class="image-upload-text">点击上传图片（最多4张）</div>
                            </div>
                            <input type="file" id="lostImages" style="display: none;" accept="image/*" multiple onchange="handleImageUpload(this, 'lostImagePreview')">
                            <div id="lostImagePreview" class="image-preview"></div>
                        </div>

                        <button type="submit" class="btn btn-primary" style="width: 100%;">提交登记</button>
                    </form>
                </div>
            </div>

            <div id="foundPage" class="page" style="display: none;">
                <div class="form-section">
                    <h2 class="form-title">📋 招领登记</h2>
                    <form id="foundItemForm">
                        <div class="form-group">
                            <label class="form-label">物品名称 <span class="required">*</span></label>
                            <input type="text" name="name" class="form-input" placeholder="请输入物品名称" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">物品类别 <span class="required">*</span></label>
                            <select name="category" class="form-input" required>
                                <option value="">请选择类别</option>
                                <option value="电子设备">📱 电子设备</option>
                                <option value="证件卡片">🪪 证件卡片</option>
                                <option value="箱包">🎒 箱包</option>
                                <option value="书籍文具">📚 书籍文具</option>
                                <option value="服饰">👕 服饰</option>
                                <option value="钥匙">🔑 钥匙</option>
                                <option value="其他">📦 其他</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">物品描述 <span class="required">*</span></label>
                            <textarea name="description" class="form-input" placeholder="请详细描述物品特征（颜色、品牌、特殊标记等）" required></textarea>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">捡到时间 <span class="required">*</span></label>
                                <input type="datetime-local" name="foundTime" class="form-input" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">捡到地点 <span class="required">*</span></label>
                                <input type="text" name="foundLocation" class="form-input" placeholder="如：图书馆三楼" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">保管方式 <span class="required">*</span></label>
                            <select name="storageMethod" class="form-input" required>
                                <option value="">请选择保管方式</option>
                                <option value="食堂">🍽️ 食堂</option>
                                <option value="宿舍">🏠 宿舍</option>
                                <option value="值班室">📋 值班室</option>
                                <option value="图书馆">📚 图书馆</option>
                                <option value="保卫处">🛡️ 保卫处</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">物品照片</label>
                            <div class="image-upload" onclick="document.getElementById('foundImages').click()">
                                <div class="image-upload-icon">📷</div>
                                <div class="image-upload-text">点击上传图片（最多4张）</div>
                            </div>
                            <input type="file" id="foundImages" style="display: none;" accept="image/*" multiple onchange="handleImageUpload(this, 'foundImagePreview')">
                            <div id="foundImagePreview" class="image-preview"></div>
                        </div>

                        <button type="submit" class="btn btn-primary" style="width: 100%;">提交登记</button>
                    </form>
                </div>
            </div>

            <div id="matchPage" class="page" style="display: none;">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">🤖 AI智能匹配推荐</h3>
                    </div>
                    <div id="recommendationsGrid" class="items-grid">
                        <div class="loading">
                            <div class="spinner"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="profilePage" class="page" style="display: none;">
                <div id="profileContent">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div>© 2026 校园智能失物招领系统</div>
            <div class="footer-links">
                <a href="#">使用帮助</a>
                <a href="#">关于我们</a>
                <a href="#">联系我们</a>
            </div>
        </div>
    </footer>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">登录</h3>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <input type="text" id="loginUsername" class="form-input" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" id="loginPassword" class="form-input" placeholder="请输入密码">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="app.login('testuser', 'password')">登录</button>
            </div>
        </div>
    </div>

    <div id="itemDetailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">物品详情</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary modal-close">关闭</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
